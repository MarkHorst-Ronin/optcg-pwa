<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><meta name="theme-color" content="#0a0a14"><title>OPTCG</title><link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Rajdhani:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet"><style>:root{--o:#0a0a14;--d:#0f1525;--s:#151d35;--cb:#1a2240;--b:#2a3560;--g:#d4a840;--gd:#8a6820;--r:#c0392b;--rb:#e74c3c;--c:#00d4ff;--gr:#27ae60;--t:#e8e8f0;--m:#6a7a9a}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:var(--o);color:var(--t);font-family:'Rajdhani',sans-serif}.sc{position:absolute;inset:0;display:none}.sc.on{display:flex;flex-direction:column}#mn{background:radial-gradient(ellipse at 50% 30%,#1a2a5e,var(--o) 70%);align-items:center;justify-content:center}.lg{font-family:'Cinzel Decorative',serif;font-size:clamp(24px,6vw,52px);font-weight:900;color:var(--g);text-align:center;text-shadow:0 0 40px rgba(212,168,64,.5);letter-spacing:2px;margin-bottom:6px}.lgs{font-size:12px;color:var(--m);letter-spacing:4px;text-transform:uppercase;margin-bottom:40px}.mbs{display:flex;flex-direction:column;gap:12px;width:min(300px,88vw)}.mb{padding:15px 20px;font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;letter-spacing:2px;text-transform:uppercase;border:none;border-radius:8px;cursor:pointer;-webkit-appearance:none;display:block;width:100%}.mb:active{transform:scale(.96)}.ma{background:linear-gradient(135deg,#c0392b,#922b21);color:#fff;border:1px solid #e74c3c;box-shadow:0 4px 16px rgba(192,57,43,.3)}.mb2{background:transparent;color:var(--g);border:1px solid var(--gd)}.mc{background:transparent;color:#444;border:1px solid #333;opacity:.5}.tb{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--d);border-bottom:1px solid var(--b);flex-shrink:0}.pp{font-size:10px;font-weight:700;letter-spacing:2px;padding:3px 10px;border-radius:99px;background:var(--s);color:var(--c);border:1px solid var(--c)}.tt{font-size:11px;color:var(--m);font-family:'Share Tech Mono',monospace}.eb{padding:5px 14px;font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--gd);background:rgba(212,168,64,.12);color:var(--g);border-radius:4px;cursor:pointer;-webkit-appearance:none}.eb:disabled{opacity:.35;pointer-events:none}.bd{flex:1;display:grid;grid-template-rows:1fr 26px 1fr;gap:3px;padding:4px;overflow:hidden}.ph{display:grid;grid-template-columns:56px 1fr 50px;gap:3px;align-items:center}.lb{width:52px;height:74px;border-radius:6px;border:2px solid var(--b);background:var(--cb);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center}.la{font-size:20px}.ln{font-size:6px;color:var(--t);font-weight:700;padding:0 2px}.lp{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--g)}.cr{display:flex;gap:3px;align-items:center;height:74px;padding:2px 4px;background:var(--d);border-radius:6px;border:1px solid var(--b);overflow-x:auto;scrollbar-width:none}.cr::-webkit-scrollbar{display:none}.lc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.ln2{font-family:'Share Tech Mono',monospace;font-size:20px;font-weight:700;color:var(--rb)}.ll{font-size:8px;color:var(--m);letter-spacing:1px}.cs{display:flex;align-items:center;padding:0 8px;background:rgba(0,212,255,.04);border-top:1px solid var(--b);border-bottom:1px solid var(--b)}.al{font-size:10px;color:var(--m);font-family:'Share Tech Mono',monospace;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pw{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--c)}.db{display:flex;align-items:center;gap:4px;padding:4px 8px;background:var(--s);border-top:1px solid var(--b);flex-shrink:0}.dl{font-size:9px;color:var(--m);letter-spacing:1px;white-space:nowrap}.dp{display:flex;gap:2px;flex:1;flex-wrap:wrap}.di2{width:18px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}.di2.ac{background:rgba(212,168,64,.25);border:1px solid var(--g);color:var(--g)}.di2.sp{background:transparent;border:1px solid #222;color:#333}.di{font-size:9px;color:var(--m);font-family:'Share Tech Mono',monospace;white-space:nowrap}.hr{flex-shrink:0;display:flex;gap:3px;align-items:flex-end;padding:5px 6px;background:var(--d);border-top:1px solid var(--b);overflow-x:auto;min-height:90px;max-height:90px;scrollbar-width:none}.hr::-webkit-scrollbar{display:none}.cd{width:52px;height:74px;border-radius:5px;background:var(--cb);border:1.5px solid var(--b);flex-shrink:0;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px;-webkit-user-select:none;user-select:none}.cd.sel{border-color:var(--c);box-shadow:0 0 10px rgba(0,212,255,.5);transform:translateY(-5px)}.cd.pl{border-color:var(--gr);box-shadow:0 0 6px rgba(39,174,96,.4)}.cd.tg{border-color:var(--rb);box-shadow:0 0 8px rgba(231,76,60,.5)}.cd.rs{transform:rotate(12deg)}.cb2{position:absolute;top:0;left:0;right:0;height:3px}.cc{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:var(--o)}.ca{font-size:18px;margin-top:14px}.cn{font-size:6px;color:var(--t);text-align:center;line-height:1.2;overflow:hidden;padding:0 1px}.cp{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--g)}.ct2{position:absolute;bottom:2px;right:2px;font-size:6px;color:var(--c)}.ck{position:absolute;top:18px;left:2px;font-size:5px;color:var(--rb);font-weight:700;line-height:1.1}.ov{position:absolute;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:100}.ov.on{display:flex}.pb{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:20px;width:min(340px,90vw);box-shadow:0 8px 40px rgba(0,0,0,.7)}.pt{font-family:'Cinzel Decorative',serif;font-size:14px;color:var(--g);margin-bottom:10px}.pbd{font-size:13px;color:var(--m);line-height:1.6;margin-bottom:14px}.pbs{display:flex;gap:8px}.p2{flex:1;padding:11px;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;border:none;border-radius:6px;cursor:pointer;-webkit-appearance:none;display:block}.p2:active{transform:scale(.97)}.py{background:var(--gr);color:#fff}.pn{background:var(--s);color:var(--m);border:1px solid var(--b)}.ctp{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}.cpx{background:var(--cb);border:1px solid var(--b);border-radius:4px;padding:5px 8px;font-size:11px;cursor:pointer;text-align:center}.cpx.on{border-color:var(--gr);background:rgba(39,174,96,.1)}.ctl{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--c);text-align:center;margin-bottom:12px}.ts{position:absolute;top:42px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--s);border:1px solid var(--b);border-radius:20px;padding:7px 16px;font-size:12px;font-weight:600;color:var(--t);opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;z-index:200}.ts.on{opacity:1;transform:translateX(-50%) translateY(0)}.ts.i{border-color:var(--c);color:var(--c)}.ts.ok{border-color:var(--gr);color:var(--gr)}.ts.w{border-color:var(--g);color:var(--g)}.ts.e{border-color:var(--rb);color:var(--rb)}.rt{font-family:'Cinzel Decorative',serif;font-size:clamp(28px,7vw,56px);font-weight:900;text-align:center;color:var(--g)}.rs2{font-size:14px;color:var(--m);letter-spacing:3px;text-transform:uppercase;margin:8px 0 32px;text-align:center}</style></head><body>
<div id="mn" class="sc on"><div class="lg">ONE PIECE<br>CARD GAME</div><div class="lgs">Digital Edition · PWA Prototype</div><div class="mbs"><button class="mb ma" onclick="startGame('ai')">⚔️ &nbsp;VS CPU (Medium AI)</button><button class="mb mb2" onclick="startGame('local')">👥 &nbsp;Local PvP (Hot Seat)</button><button class="mb mc" disabled>🌐 &nbsp;Online — Coming Soon</button></div></div>
<div id="gm" class="sc"><div class="tb"><div style="display:flex;align-items:center;gap:6px"><span class="pp" id="ph">REFRESH</span><span class="tt" id="tn">Turn 1 · P1</span></div><div class="pw" id="pw" style="display:none"></div><button class="eb" id="eb" onclick="humanEndTurn()">END TURN</button></div><div class="bd"><div class="ph"><div class="lb" id="p2lb" onclick="clickLeader(1)" style="transform:rotate(180deg)"><span class="la" id="p2a">⚔️</span><span class="ln" id="p2n">Zoro</span><span class="lp" id="p2p">5000</span></div><div class="cr" id="p2c"></div><div class="lc"><div class="ln2" id="p2l">5</div><div class="ll">LIFE</div></div></div><div class="cs"><div class="al" id="lg2">Select mode to begin</div></div><div class="ph"><div class="lb" id="p1lb" onclick="clickLeader(0)"><span class="la" id="p1a">🤠</span><span class="ln" id="p1n">Luffy</span><span class="lp" id="p1p">5000</span></div><div class="cr" id="p1c"></div><div class="lc"><div class="ln2" id="p1l">5</div><div class="ll">LIFE</div></div></div></div><div class="db"><span class="dl">DON!!</span><div class="dp" id="dp"></div><span class="di" id="di">deck:10</span></div><div class="hr" id="p1h"></div><div class="ts" id="toast"></div>
<div class="ov" id="ov-tr"><div class="pb"><div class="pt">⚡ Trigger!</div><div class="pbd"><b id="tr-n"></b><br><br>Activate this Trigger effect?</div><div class="pbs"><button class="p2 py" onclick="doTrig(true)">✓ Activate</button><button class="p2 pn" onclick="doTrig(false)">✗ Skip</button></div></div></div>
<div class="ov" id="ov-bl"><div class="pb"><div class="pt">🛡 Block Step</div><div class="pbd" id="bl-t"></div><div class="pbs"><button class="p2 py" onclick="doBlock(true)">🛡 Block</button><button class="p2 pn" onclick="doBlock(false)">→ Skip</button></div></div></div>
<div class="ov" id="ov-ct"><div class="pb"><div class="pt">⚔ Counter Step</div><div class="pbd" id="ct-t"></div><div class="ctp" id="ct-p"></div><div class="ctl" id="ct-b">Counter: +0</div><div class="pbs"><button class="p2 py" onclick="doCtr(true)">Confirm</button><button class="p2 pn" onclick="doCtr(false)">No Counter</button></div></div></div>
<div class="ov" id="ov-rs"><div style="text-align:center;padding:20px"><div class="rt" id="rs-t">P1 WINS!</div><div class="rs2" id="rs-s">Victory</div><div class="pbs" style="max-width:240px;margin:0 auto"><button class="p2 py" onclick="goMenu()">Main Menu</button></div></div></div></div>
<script>
var CARDS=[{id:'L-LUF',name:'Luffy',type:'LEADER',color:'red',power:5000,life:5,cost:0,counter:0,kw:[],art:'🤠'},{id:'L-ZOR',name:'Zoro',type:'LEADER',color:'green',power:5000,life:5,cost:0,counter:0,kw:[],art:'⚔️'},{id:'C-SAN',name:'Sanji',type:'CHAR',color:'red',power:4000,life:0,cost:3,counter:1000,kw:['RUSH'],art:'🍳'},{id:'C-ROB',name:'Robin',type:'CHAR',color:'red',power:4000,life:0,cost:3,counter:1000,kw:['BLOCKER'],art:'📚'},{id:'C-FRK',name:'Franky',type:'CHAR',color:'red',power:5000,life:0,cost:4,counter:0,kw:['DOUBLE_ATTACK'],art:'🤖'},{id:'C-SHA',name:'Shanks',type:'CHAR',color:'red',power:7000,life:0,cost:6,counter:0,kw:['BANISH'],art:'🦅'},{id:'C-USO',name:'Usopp',type:'CHAR',color:'red',power:3000,life:0,cost:2,counter:1000,kw:['TRIGGER'],art:'👃'},{id:'C-CHO',name:'Chopper',type:'CHAR',color:'red',power:2000,life:0,cost:1,counter:2000,kw:[],art:'🦌'},{id:'C-JIN',name:'Jinbe',type:'CHAR',color:'red',power:5000,life:0,cost:4,counter:0,kw:['BLOCKER','RUSH'],art:'🐟'},{id:'C-BRK',name:'Brook',type:'CHAR',color:'red',power:3000,life:0,cost:2,counter:1000,kw:[],art:'💀'},{id:'C-SMK',name:'Smoker',type:'CHAR',color:'green',power:5000,life:0,cost:4,counter:0,kw:['BLOCKER'],art:'💨'},{id:'C-MIH',name:'Mihawk',type:'CHAR',color:'green',power:6000,life:0,cost:5,counter:0,kw:['RUSH'],art:'🗡️'},{id:'C-PER',name:'Perona',type:'CHAR',color:'green',power:4000,life:0,cost:3,counter:1000,kw:[],art:'👻'},{id:'C-COB',name:'Coby',type:'CHAR',color:'blue',power:1000,life:0,cost:1,counter:2000,kw:['TRIGGER'],art:'⚓'},{id:'E-GGP',name:'Gum Gum Pistol',type:'EVENT',color:'red',power:0,life:0,cost:2,counter:2000,kw:['COUNTER'],art:'👊'},{id:'E-RAD',name:'Raid',type:'EVENT',color:'red',power:0,life:0,cost:3,counter:0,kw:[],art:'💥'},{id:'E-NHQ',name:'Navy Order',type:'EVENT',color:'blue',power:0,life:0,cost:2,counter:0,kw:[],art:'📜'}];
var G=null,_uid=0;
function uid(){return'x'+(++_uid);}
function inst(card,owner){return{id:card.id,name:card.name,type:card.type,color:card.color,power:card.power,life:card.life,cost:card.cost,counter:card.counter,kw:card.kw.slice(),art:card.art,_id:uid(),owner:owner,rested:false,don:0,age:0,tmod:[],pmod:[]};}
function P(c){var v=c.power+c.don*1000;for(var i=0;i<c.tmod.length;i++)v+=c.tmod[i];for(var i=0;i<c.pmod.length;i++)v+=c.pmod[i];return v;}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=0|Math.random()*(i+1);var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function col(c){return{red:'#c0392b',green:'#27ae60',blue:'#2980b9',black:'#666'}[c]||'#2a3560';}
function mkPl(lid,idx){var ld=null;for(var i=0;i<CARDS.length;i++){if(CARDS[i].id===lid){ld=CARDS[i];break;}}return{leader:inst(ld,idx),chars:[],hand:[],deck:[],life:[],trash:[],don:{cost:0,spent:0,deck:10},lc:ld.life,idx:idx};}
function buildDeck(color,idx){var pool=[];for(var i=0;i<CARDS.length;i++){if(CARDS[i].color===color&&CARDS[i].type!=='LEADER')pool.push(CARDS[i]);}var d=[];for(var i=0;i<50;i++)d.push(inst(pool[i%pool.length],idx));return shuffle(d);}
function startGame(mode){_uid=0;G={mode:mode,phase:'REFRESH',active:0,turn:1,first:true,P:[mkPl('L-LUF',0),mkPl('L-ZOR',1)],atk:null,battle:null,pend:null,ctrC:[],ctrB:0,blk:null};G.P[0].deck=buildDeck('red',0);G.P[1].deck=buildDeck('green',1);for(var p=0;p<2;p++)G.P[p].life=G.P[p].deck.splice(0,G.P[p].lc);for(var p=0;p<2;p++)for(var i=0;i<5;i++)draw(p);show('gm');log('Game started! P1 goes first.');setTimeout(phRefresh,300);}
function phRefresh(){setPhase('REFRESH');var pl=G.P[G.active];pl.leader.rested=false;pl.leader.tmod=[];for(var i=0;i<pl.chars.length;i++){pl.chars[i].rested=false;pl.chars[i].tmod=[];if(pl.chars[i].don>0){pl.don.cost+=pl.chars[i].don;pl.chars[i].don=0;}}if(pl.leader.don>0){pl.don.cost+=pl.leader.don;pl.leader.don=0;}pl.don.spent=0;for(var i=0;i<pl.chars.length;i++)pl.chars[i].age++;render();setTimeout(phDraw,350);}
function phDraw(){setPhase('DRAW');var p=G.active,pl=G.P[p];if(G.first&&p===0){setTimeout(phDon,300);return;}if(!pl.deck.length){gameOver(1-p,'ran out of cards');return;}draw(p);log('P'+(p+1)+' draws.');render();setTimeout(phDon,350);}
function phDon(){setPhase('DON!!');var p=G.active,pl=G.P[p];var amt=(G.first&&p===0)?1:2;var got=Math.min(amt,pl.don.deck);pl.don.deck-=got;pl.don.cost+=got;log('P'+(p+1)+' gets '+got+' DON!!');render();setTimeout(phMain,350);}
function phMain(){setPhase('MAIN');G.atk=null;render();log('P'+(G.active+1)+' Main Phase');if(G.mode==='ai'&&G.active===1)setTimeout(aiGo,700);}
function phEnd(){setPhase('END');var pl=G.P[G.active];for(var i=0;i<pl.chars.length;i++)pl.chars[i].tmod=[];pl.leader.tmod=[];log('P'+(G.active+1)+' ends turn.');G.active=1-G.active;G.turn++;G.first=false;render();setTimeout(phRefresh,400);}
function humanEndTurn(){if(!G||G.phase!=='MAIN')return;if(G.mode==='ai'&&G.active===1)return;phEnd();}
function draw(p){var pl=G.P[p];if(!pl.deck.length)return;pl.hand.push(pl.deck.shift());}
function playCard(card,p){if(!G||G.phase!=='MAIN'){toast('Main Phase only','e');return;}if(G.active!==p){toast('Not your turn','e');return;}if(G.atk){toast('Finish attack first','e');return;}var pl=G.P[p];var avail=pl.don.cost-pl.don.spent;if(card.cost>avail){toast('Need '+card.cost+' DON!!','e');return;}pl.don.spent+=card.cost;var hi=-1;for(var i=0;i<pl.hand.length;i++){if(pl.hand[i]._id===card._id){hi=i;break;}}if(hi<0)return;pl.hand.splice(hi,1);if(card.type==='EVENT'){evEffect(card,p);pl.trash.push(card);log('P'+(p+1)+' plays '+card.name);}else if(card.type==='CHAR'){if(pl.chars.length>=5){var w=pl.chars[0];for(var i=1;i<pl.chars.length;i++)if(P(pl.chars[i])<P(w))w=pl.chars[i];var ni=[];for(var i=0;i<pl.chars.length;i++)if(pl.chars[i]._id!==w._id)ni.push(pl.chars[i]);pl.chars=ni;pl.trash.push(w);}card.age=0;card.rested=false;pl.chars.push(card);onPlay(card,p);log('P'+(p+1)+' plays '+card.name);}G.atk=null;render();}
function onPlay(c,p){if(c.id==='C-CHO'){var pl=G.P[p];var t=pl.deck.shift();if(t){pl.life.push(t);pl.lc++;toast('+1 Life!','ok');}}if(c.id==='C-BRK'){var opp=G.P[1-p];if(opp.chars.length>0){opp.chars[0].rested=true;toast('Rested opp char','i');}}if(c.id==='C-SMK'){draw(p);toast('Drew 1','ok');}}
function evEffect(c,p){if(c.id==='E-NHQ'){draw(p);draw(p);toast('Drew 2!','ok');}if(c.id==='E-RAD'){var opp=G.P[1-p];var t=null;for(var i=0;i<opp.chars.length;i++)if(P(opp.chars[i])<=3000&&(!t||P(opp.chars[i])>P(t)))t=opp.chars[i];if(t){var ni=[];for(var i=0;i<opp.chars.length;i++)if(opp.chars[i]._id!==t._id)ni.push(opp.chars[i]);opp.chars=ni;opp.trash.push(t);toast('KO '+t.name,'ok');}else toast('No target','w');}}
function declAtk(card,p){if(!G||G.phase!=='MAIN'){toast('Main Phase only','e');return;}if(G.active!==p){toast('Not your turn','e');return;}if(card.rested){toast('Already rested','e');return;}if(G.turn===1&&p===0){toast('No attacks turn 1','e');return;}var ok=card.age>0||card.kw.indexOf('RUSH')>=0;if(!ok){toast('No RUSH — wait 1 turn','e');return;}if(G.atk&&G.atk._id===card._id){G.atk=null;render();return;}card.rested=true;G.atk=card;log(card.name+' — tap a target');render();}
function selectTarget(target,defP){if(!G||!G.atk)return;var atkP=G.active;if(defP===atkP){toast('Cannot target own','e');return;}if(target.type==='CHAR'&&!target.rested){toast('Must target rested chars','e');return;}G.battle={atk:G.atk,atkP:atkP,def:target,defP:defP};G.atk=null;var opp=G.P[defP];var blks=[];for(var i=0;i<opp.chars.length;i++)if(opp.chars[i].kw.indexOf('BLOCKER')>=0&&!opp.chars[i].rested)blks.push(opp.chars[i]);if(blks.length>0){if(G.mode==='ai'&&defP===1){var doBlk=G.P[1].lc<=2||G.battle.atk.kw.indexOf('DOUBLE_ATTACK')>=0;if(doBlk){blks[0].rested=true;G.battle.def=blks[0];}showCtr();}else{G.blk=blks[0];document.getElementById('bl-t').textContent=G.battle.atk.name+' attacks '+target.name+'. Block with '+blks[0].name+'?';ov('ov-bl',true);}}else showCtr();}
function clickLeader(p){if(!G)return;if(G.atk)selectTarget({name:'Leader',type:'LEADER',_id:'LD'+p,power:P(G.P[p].leader),kw:[],tmod:[],pmod:[],don:0},p);}
function doBlock(yes){ov('ov-bl',false);if(yes&&G.blk){G.blk.rested=true;G.battle.def=G.blk;}G.blk=null;showCtr();}
function showCtr(){G.ctrC=[];G.ctrB=0;var defP=G.battle.defP;var hand=[];for(var i=0;i<G.P[defP].hand.length;i++){if(G.P[defP].hand[i].counter>0)hand.push(G.P[defP].hand[i]);}document.getElementById('ct-t').textContent='ATK:'+P(G.battle.atk)+' vs DEF:'+P(G.battle.def)+'. Discard to boost?';var cont=document.getElementById('ct-p');cont.innerHTML='';for(var i=0;i<hand.length;i++){(function(c){var el=document.createElement('div');el.className='cpx';el.innerHTML='<b>'+c.name+'</b><br><span style="color:#00d4ff">+'+c.counter+'</span>';el.onclick=function(){if(el.classList.contains('on'))return;G.ctrC.push(c);G.ctrB+=c.counter;el.classList.add('on');document.getElementById('ct-b').textContent='Counter:+'+G.ctrB;};cont.appendChild(el);})(hand[i]);}document.getElementById('ct-b').textContent='Counter:+0';if(G.mode==='ai'&&defP===1){resolveBattle(0);}else ov('ov-ct',true);}
function doCtr(yes){ov('ov-ct',false);if(!yes){G.ctrC=[];G.ctrB=0;}resolveBattle(G.ctrB);}
function resolveBattle(bonus){var b=G.battle;var av=P(b.atk),dv=P(b.def)+bonus;var hit=av>=dv;var pw=document.getElementById('pw');pw.textContent='⚔'+av+' vs '+dv+(hit?' HIT!':' MISS');pw.style.display='block';var defPl=G.P[b.defP];for(var i=0;i<G.ctrC.length;i++){var ni=[];for(var j=0;j<defPl.hand.length;j++)if(defPl.hand[j]._id!==G.ctrC[i]._id)ni.push(defPl.hand[j]);defPl.hand=ni;defPl.trash.push(G.ctrC[i]);}if(hit){if(b.def.type==='LEADER'){dealDmg(b.defP,b.atk);}else{koChar(b.def,b.defP);}}else{log('Attack missed');toast('Blocked!','i');}if(b.atk&&b.atk.tmod)b.atk.tmod=[];G.battle=null;G.ctrC=[];G.ctrB=0;render();setTimeout(function(){document.getElementById('pw').style.display='none';},2000);}
function dealDmg(p,atk){var ban=atk.kw.indexOf('BANISH')>=0;var dbl=atk.kw.indexOf('DOUBLE_ATTACK')>=0;var hits=dbl?2:1;for(var i=0;i<hits;i++){if(G.P[p].lc===0){gameOver(1-p,atk.name+' struck the final blow!');return;}var lc=G.P[p].life.shift();G.P[p].lc--;if(ban){G.P[p].trash.push(lc);log('BANISH! Life:'+G.P[p].lc);toast('BANISH!','w');}else{G.P[p].hand.push(lc);log('Damage! Life:'+G.P[p].lc);toast('Life:'+G.P[p].lc,'w');if(lc.kw&&lc.kw.indexOf('TRIGGER')>=0){G.pend={card:lc,p:p};document.getElementById('tr-n').textContent=lc.name;render();setTimeout(function(){ov('ov-tr',true);},200);return;}}}render();}
function doTrig(yes){ov('ov-tr',false);if(yes&&G.pend){var c=G.pend.card,p=G.pend.p;if(c.id==='C-USO'){draw(p);toast('Drew 1','ok');}if(c.id==='C-COB'){var opp=G.P[1-p];if(opp.chars.length>0){opp.chars[0].rested=true;toast('Rested opp char','ok');}}log('Trigger:'+c.name);}G.pend=null;render();}
function koChar(c,p){var ni=[];for(var i=0;i<G.P[p].chars.length;i++)if(G.P[p].chars[i]._id!==c._id)ni.push(G.P[p].chars[i]);G.P[p].chars=ni;G.P[p].trash.push(c);log(c.name+' KO!');toast(c.name+' KO!','ok');}
function gameOver(w,reason){document.getElementById('rs-t').textContent='P'+(w+1)+' WINS!';document.getElementById('rs-s').textContent=reason;ov('ov-rs',true);}
function goMenu(){ov('ov-rs',false);show('mn');G=null;}
function aiGo(){if(!G||G.phase!=='MAIN'||G.active!==1)return;var ai=G.P[1];var avail=ai.don.cost-ai.don.spent;var best=null,bscore=-99;for(var i=0;i<ai.hand.length;i++){var c=ai.hand[i];if(c.type==='LEADER'||c.cost>avail)continue;var s=c.cost*2+c.power*.001;if(c.kw.indexOf('RUSH')>=0)s+=6;if(c.kw.indexOf('BLOCKER')>=0)s+=8;if(c.kw.indexOf('DOUBLE_ATTACK')>=0)s+=10;if(s>bscore){bscore=s;best=c;}}if(best)playCard(best,1);render();setTimeout(function(){if(!G||G.phase!=='MAIN'||G.active!==1)return;var ai=G.P[1],human=G.P[0];var atkers=[];for(var i=0;i<ai.chars.length;i++)if(!ai.chars[i].rested&&(ai.chars[i].age>0||ai.chars[i].kw.indexOf('RUSH')>=0))atkers.push(ai.chars[i]);for(var i=0;i<atkers.length;i++){if(G.turn===1)break;var atk=atkers[i];var rested=[];for(var j=0;j<human.chars.length;j++)if(human.chars[j].rested&&P(atk)>=P(human.chars[j]))rested.push(human.chars[j]);var pw=document.getElementById('pw');if(rested.length>0){atk.rested=true;var av=P(atk),dv=P(rested[0]);pw.textContent='AI:'+av+' vs '+dv;pw.style.display='block';if(av>=dv)koChar(rested[0],0);render();setTimeout(function(){pw.style.display='none';},1500);}else{atk.rested=true;var av2=P(atk),dv2=P(human.leader);pw.textContent='AI:'+av2+' vs Leader '+dv2;pw.style.display='block';if(av2>=dv2)dealDmg(0,atk);render();setTimeout(function(){pw.style.display='none';},1500);}}render();setTimeout(phEnd,900);},600);}
function render(){if(!G)return;renderP(0);renderP(1);renderDon();renderHand();document.getElementById('ph').textContent=G.phase;document.getElementById('tn').textContent='Turn '+G.turn+' P'+(G.active+1);var eb=document.getElementById('eb');eb.disabled=!(G.phase==='MAIN'&&(G.mode==='local'||G.active===0));}
function renderP(p){var pl=G.P[p],pfx=p===0?'p1':'p2';document.getElementById(pfx+'a').textContent=pl.leader.art||'👑';document.getElementById(pfx+'n').textContent=pl.leader.name;document.getElementById(pfx+'p').textContent=P(pl.leader);document.getElementById(pfx+'l').textContent=pl.lc;document.getElementById(pfx+'lb').style.borderColor=col(pl.leader.color);var cr=document.getElementById(pfx+'c');cr.innerHTML='';for(var i=0;i<pl.chars.length;i++)cr.appendChild(mkCard(pl.chars[i],p,'char'));}
function mkCard(card,p,zone){var el=document.createElement('div');el.className='cd';if(card.rested)el.classList.add('rs');if(G.atk&&G.atk._id===card._id)el.classList.add('sel');if(zone==='char'&&p!==G.active&&G.atk&&card.rested)el.classList.add('tg');if(zone==='hand'&&p===G.active&&G.phase==='MAIN'){var avail=G.P[p].don.cost-G.P[p].don.spent;if(card.cost<=avail)el.classList.add('pl');}var bar=document.createElement('div');bar.className='cb2';bar.style.background=col(card.color);el.appendChild(bar);if(card.cost>0){var cc=document.createElement('div');cc.className='cc';cc.textContent=card.cost;el.appendChild(cc);}if(card.kw&&card.kw.length){var kk=document.createElement('div');kk.className='ck';kk.textContent=card.kw.slice(0,2).join('\n');el.appendChild(kk);}var ar=document.createElement('div');ar.className='ca';ar.textContent=card.art||'🃏';el.appendChild(ar);var nm=document.createElement('div');nm.className='cn';nm.textContent=card.name;el.appendChild(nm);if(card.power>0){var pw2=document.createElement('div');pw2.className='cp';pw2.textContent=P(card);el.appendChild(pw2);}if(card.counter>0){var ct=document.createElement('div');ct.className='ct2';ct.textContent='+'+card.counter;el.appendChild(ct);}(function(c,pi,z){if(z==='hand'&&pi===G.active&&G.phase==='MAIN'&&!G.atk)el.onclick=function(){playCard(c,pi);};if(z==='char'&&pi===G.active&&G.phase==='MAIN'&&!c.rested)el.onclick=function(){declAtk(c,pi);};if(z==='char'&&pi!==G.active&&G.atk&&c.rested)el.onclick=function(){selectTarget(c,pi);};})(card,p,zone);return el;}
function renderDon(){var pl=G.P[G.active];var cont=document.getElementById('dp');cont.innerHTML='';var tot=pl.don.cost,sp=pl.don.spent;for(var i=0;i<Math.min(tot,10);i++){var d=document.createElement('div');d.className='di2 '+(i<sp?'sp':'ac');d.textContent='①';cont.appendChild(d);}document.getElementById('di').textContent='deck:'+pl.don.deck+' | '+(tot-sp)+' active';}
function renderHand(){var pl=G.P[0];var h=document.getElementById('p1h');h.innerHTML='';for(var i=0;i<pl.hand.length;i++)h.appendChild(mkCard(pl.hand[i],0,'hand'));}
function setPhase(p){if(G)G.phase=p;document.getElementById('ph').textContent=p;}
function log(t){document.getElementById('lg2').textContent=t;}
function show(id){var ss=document.querySelectorAll('.sc');for(var i=0;i<ss.length;i++)ss[i].classList.remove('on');document.getElementById(id).classList.add('on');}
function ov(id,on){document.getElementById(id).classList[on?'add':'remove']('on');}
var _tt=null;
function toast(msg,type){var el=document.getElementById('toast');el.textContent=msg;el.className='ts on '+(type||'i');clearTimeout(_tt);_tt=setTimeout(function(){el.classList.remove('on');},2200);}
</script></body></html>
